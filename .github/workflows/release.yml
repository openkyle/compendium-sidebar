name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build module archive
        run: zip -r compendium-sidebar.zip module.json scripts styles templates lang README.md CHANGELOG.md LICENSE docs
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            module.json
            compendium-sidebar.zip
